name: DragonWing Code iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/DragonWingCode/**"
      - ".github/workflows/dragonwing-code-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install local Monaco Editor assets
        working-directory: ios/DragonWingCode
        run: |
          set -euo pipefail
          npm install --prefix .monaco-build monaco-editor@0.52.2 --no-save --ignore-scripts
          mkdir -p Resources/monaco
          cp -R .monaco-build/node_modules/monaco-editor/min/vs Resources/monaco/

      - name: Generate DragonWing Code app icon
        working-directory: ios/DragonWingCode
        run: swift scripts/make-app-icon.swift

      - name: Generate Xcode project
        working-directory: ios/DragonWingCode
        run: xcodegen generate

      - name: Build iOS device app (unsigned)
        working-directory: ios/DragonWingCode
        run: |
          set -euo pipefail
          xcodebuild \
            -project DragonWingCode.xcodeproj \
            -scheme DragonWingCode \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        working-directory: ios/DragonWingCode
        run: |
          set -euo pipefail
          APP_PATH="build-device/Build/Products/Release-iphoneos/DragonWing Code.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          mkdir -p ipa/Payload
          ditto "$APP_PATH" "ipa/Payload/DragonWing Code.app"
          cd ipa
          /usr/bin/zip -qry ../DragonWingCode-unsigned.ipa Payload
          cd ..
          test -s DragonWingCode-unsigned.ipa
          /usr/bin/unzip -l DragonWingCode-unsigned.ipa

      - name: Build iOS Simulator app
        working-directory: ios/DragonWingCode
        run: |
          xcodebuild \
            -project DragonWingCode.xcodeproj \
            -scheme DragonWingCode \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DragonWingCode-unsigned-IPA
          path: ios/DragonWingCode/DragonWingCode-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: DragonWingCode-iOS-Simulator
          path: "ios/DragonWingCode/build-simulator/Build/Products/Debug-iphonesimulator/DragonWing Code.app"
          if-no-files-found: error
          retention-days: 30
