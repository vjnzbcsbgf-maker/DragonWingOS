name: DragonWingCodeNiche
options:
  bundleIdPrefix: dev.dragonwing
  deploymentTarget:
    iOS: "16.0"
targets:
  DragonWingCodeNiche:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dragonwing.code.niche
        PRODUCT_NAME: DragonWing Code Niche
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: DragonWing Niche
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
